<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vincufy</title>
    <script>
      // SPA redirect for GitHub Pages — converts /q/eventos/r/X into /?p=/q/eventos/r/X
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        "/?p=" + encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
